name: Daily BuzzHeavier Link Keep-Alive

on:
  schedule:
    # Runs every 8 hours at 03:00, 11:00, and 19:00 UTC
    - cron: '0 3,11,19 * * *'
  workflow_dispatch:
    inputs:
      max_shards:
        description: 'Upper bound of parallel runner shards (actual count adapts to link volume)'
        required: false
        default: '50'
        type: string
      links_per_shard:
        description: 'Target number of links per runner when planning the matrix'
        required: false
        default: '25'
        type: string
      delay:
        description: 'Pacing delay between requests per runner (seconds)'
        required: false
        default: '1.0'
        type: string
      workers:
        description: 'Worker threads per runner'
        required: false
        default: '1'
        type: string
      retries:
        description: 'Max curl_cffi retries before stealth-browser fallback'
        required: false
        default: '2'
        type: string
      soft_fail:
        description: 'Do not fail workflow if dead/expired (404) links are found'
        required: false
        default: true
        type: boolean
  push:
    paths:
      - 'links.txt' # Runs automatically when links.txt is updated

# Avoid overlapping runs (schedule + push + manual) hammering the site at once
concurrency:
  group: buzzheavier-keepalive
  cancel-in-progress: false

jobs:
  init-matrix:
    name: Plan Adaptive Shard Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      total_shards: ${{ steps.set-matrix.outputs.total_shards }}
      link_count: ${{ steps.set-matrix.outputs.link_count }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Compute Adaptive Shard Count
        id: set-matrix
        env:
          MAX_SHARDS: ${{ inputs.max_shards || '50' }}
          LINKS_PER_SHARD: ${{ inputs.links_per_shard || '25' }}
        run: |
          # NOTE: outputs are written straight to $GITHUB_OUTPUT from inside Python.
          # Never redirect this script's whole stdout there: GitHub rejects any line
          # that is not strictly `key=value` (e.g. human-readable log lines).
          python - <<'PY'
          import json, math, os, re

          try:
              max_shards = min(256, max(1, int(os.environ.get("MAX_SHARDS", "50") or "50")))
          except ValueError:
              max_shards = 50
          try:
              per_shard = max(1, int(os.environ.get("LINKS_PER_SHARD", "25") or "25"))
          except ValueError:
              per_shard = 25

          # Count unique links exactly the way get_download_link.py does
          # (strip comments/blank lines, dedupe by parsed file ID).
          try:
              raw = [l.strip() for l in open("links.txt", encoding="utf-8")]
          except OSError:
              raw = []
          ids = set()
          for line in raw:
              if not line or line.startswith("#"):
                  continue
              m = re.search(r'(?:https?://(?:buzzheavier\.com|bzzhr\.to)/)?([a-zA-Z0-9]{8,16})', line)
              ids.add(m.group(1) if m else line)

          unique = len(ids)
          if unique == 0:
              total = 0
          else:
              # ceil(unique / per_shard), clamped to [1, max_shards]
              total = min(max_shards, max(1, (unique + per_shard - 1) // per_shard))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as gh_out:
              gh_out.write(f"matrix={json.dumps(list(range(1, total + 1)))}\n")
              gh_out.write(f"total_shards={total}\n")
              gh_out.write(f"link_count={unique}\n")

          print(f"[plan] {unique} unique link(s) -> {total} runner(s) "
                f"(target {per_shard} links/runner, cap {max_shards})")
          PY

      - name: Publish Sharding Plan to Step Summary
        run: |
          {
            echo "### 🧮 Adaptive Sharding Plan"
            echo ""
            echo "- Unique links: **${{ steps.set-matrix.outputs.link_count }}**"
            echo "- Links per runner (target): **${{ inputs.links_per_shard || '25' }}**"
            echo "- Runners spawned: **${{ steps.set-matrix.outputs.total_shards }}** (cap ${{ inputs.max_shards || '50' }})"
          } >> "$GITHUB_STEP_SUMMARY"

  check-links:
    name: Shard ${{ matrix.shard }}
    needs: init-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 350 # GitHub-hosted runner hard limit is 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.init-matrix.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Verify the installed curl_cffi actually ships a modern fingerprint set
          python -c "import curl_cffi; print('curl_cffi', curl_cffi.__version__)"

      - name: Randomized Start Jitter
        run: |
          # Synchronized starts from adjacent Azure IP ranges look like a burst to
          # Cloudflare. Scale the stagger with the fleet size: up to 90s for a 50-
          # shard fleet, only a few seconds for a small one (so tiny runs stay fast).
          TOTAL_SHARDS="${{ needs.init-matrix.outputs.total_shards }}"
          JITTER_MAX=$(( TOTAL_SHARDS * 3 ))
          if [ "$JITTER_MAX" -gt 90 ]; then JITTER_MAX=90; fi
          if [ "$JITTER_MAX" -lt 1 ]; then JITTER_MAX=1; fi
          JITTER=$((RANDOM % JITTER_MAX))
          echo "Staggering shard start by ${JITTER}s (max ${JITTER_MAX}s across ${TOTAL_SHARDS} shard(s))"
          sleep "$JITTER"

      - name: Run Shard Keep-Alive Check
        env:
          PYTHONUNBUFFERED: "1"
          # Optional: point BH_PROXY at a residential/ISP proxy secret to defeat
          # Cloudflare's datacenter-IP scoring on GitHub runners.
          BH_PROXY: ${{ secrets.PROXY_URL }}
        run: |
          SHARD_ARG="${{ matrix.shard }}/${{ needs.init-matrix.outputs.total_shards }}"
          DELAY_ARG="${{ inputs.delay || '1.0' }}"
          WORKERS_ARG="${{ inputs.workers || '1' }}"
          RETRIES_ARG="${{ inputs.retries || '2' }}"
          SOFT_FAIL_FLAG="${{ (inputs.soft_fail != false) && '--soft-fail' || '' }}"

          # xvfb-run gives the stealth-browser fallback a virtual display: Cloudflare's
          # managed challenges do not reliably auto-solve in headless Chromium (verified
          # experimentally), so patchright runs headful under Xvfb on the runner.
          # Explicit 1280x1024x24 screen: some Cloudflare checks read display metrics.
          xvfb-run -a -s "-screen 0 1280x1024x24" python get_download_link.py links.txt -l \
            --shard "$SHARD_ARG" \
            --delay "$DELAY_ARG" \
            --workers "$WORKERS_ARG" \
            --retries "$RETRIES_ARG" \
            --retry-delay 2.0 \
            --browser-timeout 120 \
            --output-json "reports/shard_${{ matrix.shard }}.json" \
            --failed-file "reports/failed_${{ matrix.shard }}.txt" \
            $SOFT_FAIL_FLAG

      - name: Upload Shard Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-result-${{ matrix.shard }}
          path: reports/
          retention-days: 7

  aggregate-summary:
    name: Aggregate & Publish Report
    needs: [init-matrix, check-links]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download all Shard Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: shard-result-*
          merge-multiple: true
          path: all_reports

      - name: Generate Consolidated Summary & Dead Links List
        run: |
          SOFT_FAIL_FLAG="${{ (inputs.soft_fail != false) && '--soft-fail' || '' }}"
          python .github/scripts/aggregate_reports.py all_reports --output-failed dead_links.txt $SOFT_FAIL_FLAG

      - name: Upload Dead Links Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dead-links-report
          path: dead_links.txt
          retention-days: 30
          if-no-files-found: ignore
